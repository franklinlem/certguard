server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location /api/v1/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    client_max_body_size 8k;
  }
  location = /api/health {
    proxy_pass http://api:8080/health;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  location = /api/ready {
    proxy_pass http://api:8080/ready;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  location = /metrics { return 404; }
  location /api/ { return 404; }
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}

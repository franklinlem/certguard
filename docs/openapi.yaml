        '429':
          description: Limite excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Indisponibilidade temporária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'

        '403':
          description: Origem ou CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Registro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflito, pausa, lock ou cooldown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Limite excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Indisponibilidade temporária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
  /api/v1/endpoints/{id}/checks:
    get:
      summary: Histórico, inclusive de arquivados
      security:
      - session: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:

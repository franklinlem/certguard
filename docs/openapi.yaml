openapi: 3.0.3
info:
  title: CertGuard — API administrativa
  version: 0.0.5
  description: 'API administrativa: sessões, endpoints, checks persistidos, configuração
    de agendamento e dashboard. Eventos de alerta transacionais; sem entrega externa.'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-certguard_session
      description: Em HTTP local, o cookie chama-se certguard_session.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
      required:
      - id
      - email
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        background:
          type: object
          required:
          - scheduler_enabled
          - check_workers
          - retention_enabled
          - retention_days
          properties:
            scheduler_enabled:
              type: boolean
            check_workers:
              type: integer
              minimum: 1
              maximum: 25
            retention_enabled:
              type: boolean
            retention_days:
              type: integer
              minimum: 30
              maximum: 36500
      required:
      - user
      - csrf_token
      - background
    EndpointInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        hostname:
          type: string
          maxLength: 253
        port:
          type: integer
          enum:
          - 443
          default: 443
        enabled:
          type: boolean
          default: true
        interval_minutes:
          type: integer
          minimum: 5
          maximum: 10080
          default: 360
        warning_days:
          type: integer
          minimum: 1
          maximum: 36500
          default: 30
        critical_days:
          type: integer
          minimum: 0
          maximum: 36499
          default: 7
      required:
      - name
      - hostname
    EndpointPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        hostname:
          type: string
          maxLength: 253
        port:
          type: integer
          enum:
          - 443
          default: 443
        enabled:
          type: boolean
          default: true
        interval_minutes:
          type: integer
          minimum: 5
          maximum: 10080
          default: 360
        warning_days:
          type: integer
          minimum: 1
          maximum: 36500
          default: 30
        critical_days:
          type: integer
          minimum: 0
          maximum: 36499
          default: 7
      minProperties: 1
      additionalProperties: false
    Endpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        hostname:
          type: string
          maxLength: 253
        port:
          type: integer
          enum:
          - 443
          default: 443
        enabled:
          type: boolean
          default: true
        interval_minutes:
          type: integer
          minimum: 5
          maximum: 10080
          default: 360
        warning_days:
          type: integer
          minimum: 1
          maximum: 36500
          default: 30
        critical_days:
          type: integer
          minimum: 0
          maximum: 36499
          default: 7
        last_check_at:
          type: string
          format: date-time
          nullable: true
        next_check_at:
          type: string
          format: date-time
          nullable: true
          description: Previsão persistida; execução depende do agendador habilitado
            e de capacidade disponível.
      required:
      - id
      - name
      - hostname
      - port
      - enabled
      - interval_minutes
      - warning_days
      - critical_days
    Certificate:
      type: object
      properties:
        subject:
          type: string
        issuer:
          type: string
        serial_number:
          type: string
        dns_names:
          type: array
          items:
            type: string
        ip_addresses:
          type: array
          items:
            type: string
        email_addresses:
          type: array
          items:
            type: string
        uris:
          type: array
          items:
            type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        fingerprint_sha256:
          type: string
    Result:
      type: object
      properties:
        hostname:
          type: string
        port:
          type: integer
        checked_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        status:
          type: string
          enum:
          - healthy
          - warning
          - critical
          - error
        code:
          type: string
        resolved_ip:
          type: string
        tls_version:
          type: string
        cipher_suite:
          type: string
        certificate:
          $ref: '#/components/schemas/Certificate'
        chain:
          type: array
          items:
            $ref: '#/components/schemas/Certificate'
        days_remaining:
          type: integer
        hostname_valid:
          type: boolean
        chain_valid:
          type: boolean
      required:
      - hostname
      - port
      - checked_at
      - status
      - code
    Check:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        result:
          $ref: '#/components/schemas/Result'
      required:
      - id
      - endpoint_id
      - result
    EndpointPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        limit:
          type: integer
        offset:
          type: integer
      required:
      - items
      - limit
      - offset
    CheckPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Check'
        limit:
          type: integer
        offset:
          type: integer
      required:
      - items
      - limit
      - offset
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 72
      required:
      - email
      - password
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        enabled:
          type: integer
          minimum: 0
        paused:
          type: integer
          minimum: 0
        healthy:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
        unchecked:
          type: integer
          minimum: 0
        expiring_30_days:
          type: integer
          minimum: 0
      required:
      - total
      - enabled
      - paused
      - healthy
      - warning
      - critical
      - errors
      - unchecked
      - expiring_30_days
    EndpointView:
      allOf:
      - $ref: '#/components/schemas/Endpoint'
      - type: object
        properties:
          latest:
            type: object
            properties:
              hostname:
                type: string
              port:
                type: integer
              checked_at:
                type: string
                format: date-time
              duration_ms:
                type: integer
              status:
                type: string
                enum:
                - healthy
                - warning
                - critical
                - error
              code:
                type: string
              resolved_ip:
                type: string
              tls_version:
                type: string
              cipher_suite:
                type: string
              certificate:
                $ref: '#/components/schemas/Certificate'
              chain:
                type: array
                items:
                  $ref: '#/components/schemas/Certificate'
              days_remaining:
                type: integer
              hostname_valid:
                type: boolean
              chain_valid:
                type: boolean
            required:
            - hostname
            - port
            - checked_at
            - status
            - code
            nullable: true
        required:
        - latest
    Dashboard:
      type: object
      required:
      - summary
      - items
      - generated_at
      - limit
      - offset
      properties:
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EndpointView'
        generated_at:
          type: string
          format: date-time
        limit:
          type: integer
        offset:
          type: integer
    AlertEvent:
      type: object
      required:
      - id
      - endpoint_id
      - check_id
      - endpoint_name
      - hostname
      - port
      - event_type
      - severity
      - threshold_days
      - snapshot
      - created_at
      - resolved_at
      - resolution
      properties:
        id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        check_id:
          type: string
          format: uuid
          nullable: true
        endpoint_name:
          type: string
        hostname:
          type: string
        port:
          type: integer
          enum:
          - 443
        event_type:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        threshold_days:
          type: integer
        snapshot:
          $ref: '#/components/schemas/Result'
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution:
          type: string
          enum:
          - recovered
          - changed
          - target_changed
          - archived
          nullable: true
    AlertSummary:
      type: object
      required:
      - active
      - critical
      - resolved
      - info
      properties:
        active:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        resolved:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
    AlertPage:
      type: object
      required:
      - items
      - summary
      - limit
      - offset
      - generated_at
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertEvent'
        summary:
          $ref: '#/components/schemas/AlertSummary'
        limit:
          type: integer
        offset:
          type: integer
        generated_at:
          type: string
          format: date-time
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Origem exata PUBLIC_APP_URL; enviada automaticamente pelo navegador.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
paths:
  /api/v1/auth/login:
    post:
      summary: Entrar; cria cookie HttpOnly/SameSite Strict, Secure fora do desenvolvimento
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais ou sessão inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origem ou CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Registro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflito, pausa, lock ou cooldown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Limite excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Indisponibilidade temporária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /api/v1/auth/me:
    get:
      summary: Consultar sessão
      security:
      - session: []
      responses:
        '200':

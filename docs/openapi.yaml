        '429':
          description: Limite excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Indisponibilidade temporária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: []
  /api/v1/auth/logout:
    post:
      summary: Revogar sessão atual
      security:
      - session: []
      responses:
        '204':
          description: Operação concluída
        '400':
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais ou sessão inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origem ou CSRF inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Registro não encontrado
          content:

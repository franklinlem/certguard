name: Validação
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: certguard
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: certguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U certguard -d certguard_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://certguard:ci_only_password@localhost:5432/certguard_test?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Cobertura mínima de 80% em cada pacote core
        run: |
          for package in security certificate; do
            go test -coverprofile="${package}.out" "./internal/${package}"
            go tool cover -func="${package}.out" | awk '/^total:/ {gsub(/%/, "", $3); if ($3 < 80) exit 1}'
          done
      - run: go test ./internal/security -fuzz=FuzzNormalize -fuzztime=10s
      - name: Benchmark de leituras em banco descartável (1000 endpoints, 3000 checks)
        run: go test -run '^$' -bench '^BenchmarkPostgres(Dashboard|Metrics)$' -benchtime=20x -benchmem ./internal/storage
      - run: go build ./cmd/certguard
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci_disposable_password_1234567890
      APP_ENV: development
      PUBLIC_APP_URL: http://localhost:8088
      SCHEDULER_ENABLED: "false"
      RETENTION_ENABLED: "false"
      DELIVERY_ENABLED: "false"
      ALERT_ENCRYPTION_KEY: ""
      METRICS_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar e subir ambiente descartável
        run: |
          docker compose -p certguard-ci -f deploy/compose.yaml -f deploy/compose.dev.yaml config --quiet
          docker compose -p certguard-ci -f deploy/compose.yaml -f deploy/compose.dev.yaml up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8081/health
          curl --fail http://127.0.0.1:8081/ready
          curl --fail http://127.0.0.1:8088/ | grep 'CertGuard'
          curl --fail http://127.0.0.1:8088/api/ready
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Preparar administrador descartável para E2E
        run: printf '%s' 'Senha-E2E-descartavel-123' | docker compose -p certguard-ci -f deploy/compose.yaml exec -T api certguard admin-create admin@example.com
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
        working-directory: web
      - name: Ensaiar backup/restauração somente em banco descartável novo
        run: bash scripts/ci-backup-restore.sh
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -p certguard-ci -f deploy/compose.yaml logs --no-color
      - name: Encerrar somente o projeto efêmero da CI
        if: always()
        run: docker compose -p certguard-ci -f deploy/compose.yaml -f deploy/compose.dev.yaml down --volumes
